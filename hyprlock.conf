$font = sans-serif

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    inner_color = rgba(20, 20, 30, 0.75)
    outer_color = rgba(180, 190, 220, 0.8)
    font_color = rgb(240, 240, 245)
    check_color = rgb(120, 200, 160)
    fail_color = rgb(230, 100, 100)
    rounding = 12
    font_family = $font
    placeholder_text = Enter password...
    fade_on_empty = false
    position = 0, -50
    halign = center
    valign = center
}
